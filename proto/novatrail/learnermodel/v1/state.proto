// The state of the learner model: the fold of a learner's evidence log, which api keeps as a
// cache beside it, marked with the version of learner-model (docs/architecture.md, sections
// 3.1–3.3 and 3.5, of learner-model). What depends on the time of reading is not in it.
syntax = "proto3";

package novatrail.learnermodel.v1;

import "novatrail/learnermodel/v1/common.proto";

// The state of one learner.
message State {
  // The kind of the state, from 1: what fields it carries.
  optional int32 kind = 1;
  // The modules the learner has evidence in, ordered by module ID byte by byte.
  repeated ModuleState modules = 2;
}

// The state of a learner in one module.
message ModuleState {
  // The full ID of the module.
  optional string module_id = 1;
  // The level θ, on the module's scale of bands.
  optional double level = 2;
  // n, the sum of the weights of the module's answers.
  optional double answer_weight = 3;
  // The band the level started from, which the module's first evidence fixed.
  BandRef start_band = 4;
  // The answers of the trial series, in the order of the log, while it lasts: empty after it.
  repeated TrialAnswer trial_answers = 5;
  // The traps the program found that have no skill with a state, ordered by ID byte by byte.
  repeated TrapCount traps = 6;
  // The skills with a state, ordered by skill ID byte by byte.
  repeated SkillState skills = 7;
}

// One answer of the trial series, as its likelihood needs it.
message TrialAnswer {
  // The place of the task's band.
  optional int32 band_place = 1;
  // The task's difficulty, from 1 to 5.
  optional int32 difficulty = 2;
  // The item's answer slots, in their order, for its guessing.
  repeated AnswerSlot answer_slots = 3;
  // The item's first verdict.
  optional Verdict verdict = 4;
  // The answer's weight u in its series of the attempt.
  optional double weight = 5;
}

// The state of one skill of the module whose assessability is `verdict`.
message SkillState {
  // The full ID of the skill.
  optional string skill_id = 1;
  // The correction δ: the estimate of the skill is the level plus it.
  optional double correction = 2;
  // m, the sum of the weights of the answers of items where the skill is primary.
  optional double answer_weight = 3;
  // The number of pieces of evidence with an answer of the skill.
  optional int64 evidence_count = 4;
  // The time of the latest practice, in whole seconds of Unix time, UTC.
  optional int64 last_practice_time = 5;
  // The stability τ, in days: the pause after which the retention is 0.9.
  optional double stability = 6;
  // The traps of the skill the program found, ordered by ID byte by byte.
  repeated TrapCount traps = 7;
  // The mastery band, by place; absent while the skill is not mastered.
  optional int32 mastery_band_place = 8;
  // The pieces of evidence in a row where fewer than half of the skill's answers were right.
  optional int32 failures_in_a_row = 9;
}
