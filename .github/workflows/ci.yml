# NovaTrail's shared checks (R03 .github), pinned to a release of .github by SHA with its version
# beside it; Dependabot moves both. The repository's own jobs go beside them.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run; every commit to main is checked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secrets
    uses: altnovatrail/.github/.github/workflows/secrets.yml@89d3ceee0b9977b3334488a4133d084d76474e0d # v0.1.15

  # A pull request's commits are what it checks; a push to main has been checked as one.
  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    uses: altnovatrail/.github/.github/workflows/dco.yml@89d3ceee0b9977b3334488a4133d084d76474e0d # v0.1.15

  documents:
    name: Documents
    uses: altnovatrail/.github/.github/workflows/documents.yml@89d3ceee0b9977b3334488a4133d084d76474e0d # v0.1.15

  # The repository's Go code, by its own ci- recipes in its toolchain stage, and the coverage of
  # its tests, which the shared workflow sends to Codecov (R16 .github). id-token: write is for its
  # coverage job alone, which asks for an OIDC token: a called workflow can only lower what this
  # job gives it.
  go:
    name: Go
    permissions:
      contents: read
      id-token: write
    uses: altnovatrail/.github/.github/workflows/go.yml@89d3ceee0b9977b3334488a4133d084d76474e0d # v0.1.15

  # The same ci-test on arm64 hardware, where the compiler fuses and math.Exp has assembler of its
  # own (R09; docs/architecture.md, section 3.6): the same toolchain stage, run as go.yml runs it.
  # The shared go.yml runs on ubuntu-24.04 alone. The coverage this run writes is not sent.
  go-arm64:
    name: Go arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain image
        run: docker build --target toolchain --tag toolchain - < .devcontainer/Dockerfile

      - name: ci-test
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --volume "$PWD:/work" --workdir /work \
              toolchain just ci-test

  # The schema of the evidence and the state, by buf of the toolchain stage (R10;
  # docs/architecture.md, section 3.7): lint, breaking against the latest tag v*, which is why the
  # checkout takes the tags, and the golden bytes of the codec converted to JSON and back. Then the
  # file a release signs, the schema's archive, built twice and held to the tree (R16).
  proto:
    name: Proto
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Toolchain image
        run: docker build --target toolchain --tag toolchain - < .devcontainer/Dockerfile

      - name: ci-proto
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --volume "$PWD:/work" --workdir /work \
              toolchain just ci-proto

      - name: ci-release
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --volume "$PWD:/work" --workdir /work \
              toolchain just ci-release
