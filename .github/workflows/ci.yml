# NovaTrail's shared checks (R03 .github), pinned to a release of .github by SHA with its version
# beside it; Dependabot moves both. The repository's own jobs go beside them.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run; every commit to main is checked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secrets
    uses: altnovatrail/.github/.github/workflows/secrets.yml@706f4067a66c91b0442033f82a7924eeb8b60497 # v0.1.21

  # A pull request's commits are what it checks; a push to main has been checked as one.
  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    uses: altnovatrail/.github/.github/workflows/dco.yml@706f4067a66c91b0442033f82a7924eeb8b60497 # v0.1.21

  documents:
    name: Documents
    uses: altnovatrail/.github/.github/workflows/documents.yml@706f4067a66c91b0442033f82a7924eeb8b60497 # v0.1.21

  # The repository's Go code, by its own ci- recipes in its toolchain stage, and the coverage of
  # its tests, which the shared workflow sends to Codecov (R16 .github). same-bits holds the bits
  # the same on every build: the tests on the targets, the comparison of the assembler with fusion
  # and without it, ci-test and the targets on arm64, and the rules of code by .github's tool with
  # the lists of .github/coderules.json — "Go / targets", "Go / fma-diff", "Go / arm64" and
  # "Go / rules" (R09; R107 spec). id-token: write is for its coverage job alone, which asks for an
  # OIDC token: a called workflow can only lower what this job gives it.
  go:
    name: Go
    permissions:
      contents: read
      id-token: write
    uses: altnovatrail/.github/.github/workflows/go.yml@706f4067a66c91b0442033f82a7924eeb8b60497 # v0.1.21
    with:
      same-bits: true

  # The schema of the evidence and the state, by buf of the toolchain stage (R10;
  # docs/architecture.md, section 3.7): lint, breaking against the latest tag v*, which is why the
  # checkout takes the tags, and the golden bytes of the codec converted to JSON and back. Then the
  # file a release signs, the schema's archive, built twice and held to the tree (R16).
  proto:
    name: Proto
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Toolchain image
        run: docker build --target toolchain --tag toolchain - < .devcontainer/Dockerfile

      - name: ci-proto
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --volume "$PWD:/work" --workdir /work \
              toolchain just ci-proto

      - name: ci-release
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --volume "$PWD:/work" --workdir /work \
              toolchain just ci-release

  # The gate of sim: every change to the model after its baseline, v0.1.0, passes the bench (R12;
  # R103 spec). sim comes from git by the tag and the SHA of its commit below, not as a release
  # file, and neither Dependabot nor a shared workflow raises them: this repository's session does,
  # by the order of releases of R103 spec (R15, R20). Its own recipe, `just gate`, builds the bench
  # on this checkout in place of learner-model's commit in gate.json, through a go.work it writes in
  # a temporary folder and never commits, with engine at the commit gate.json names, and holds the
  # numbers to their bands — red when one leaves them, for the better or the worse — in the
  # toolchain stage of sim's devcontainer of the same tag. The release waits for this job too: it
  # follows a green CI on main.
  gate:
    name: Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SIM_TAG: v0.1.10
      SIM_COMMIT: ff921be033917605b7be9d8d194a3c41a90c280c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: lm

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: altnovatrail/sim
          ref: ${{ env.SIM_COMMIT }}
          persist-credentials: false
          path: sim

      # The tag names the commit: a tag moved by mistake stops here, as sim's recipe stops a library
      # whose tag is not on the commit gate.json names. An annotated tag points at it through ^{}.
      - name: sim tag
        run: |
          tags="$(git ls-remote https://github.com/altnovatrail/sim "refs/tags/$SIM_TAG" "refs/tags/$SIM_TAG^{}")"
          tagged="$(printf '%s\n' "$tags" | awk -v ref="refs/tags/$SIM_TAG^{}" '$2 == ref { print $1 }')"
          if [ -z "$tagged" ]; then
              tagged="$(printf '%s\n' "$tags" | awk '{ print $1 }')"
          fi
          if [ "$tagged" != "$SIM_COMMIT" ]; then
              echo "sim $SIM_TAG is on ${tagged:-no commit}, and this workflow names $SIM_COMMIT" >&2
              exit 1
          fi

      - name: Toolchain image of sim
        run: docker build --target toolchain --tag sim-toolchain - < sim/.devcontainer/Dockerfile

      - name: gate
        run: |
          set -o pipefail
          docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --env GATE_LEARNER_MODEL=/work/lm \
              --volume "$PWD:/work" --workdir /work/sim \
              sim-toolchain just gate | tee -a "$GITHUB_STEP_SUMMARY"
