version: 2

updates:
  # The actions of the workflows, and the references to .github's shared workflows with them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3

  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
    cooldown:
      default-days: 3

  # The Go modules the code is built from, as in every Go repository of NovaTrail (architecture 3.3
  # .github). go.mod requires none — the code takes Go's standard library alone (R09 in
  # docs/decisions.md) — so it has nothing to raise. Go itself, in the
  # Dockerfile, and the tools the recipes run by `go run` at an exact version are not among them:
  # those are raised by hand. Neither is .devcontainer/gopls/, the lock file of gopls: it is spec's,
  # from the go kind of its template, and goes up with GOPLS_VERSION in the Dockerfile only by a
  # move to a newer tag of spec (R19 in docs/decisions.md).
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
